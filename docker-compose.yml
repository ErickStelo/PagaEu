services:
  pagaeu:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PAGAEU_PORT:-3000}:3000"
    networks:
      - postgres
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  postgres:
    external: true
    name: ${PAGAEU_DOCKER_NETWORK}
